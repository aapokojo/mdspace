name: Enable auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge when repository settings allow it
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;

            if (pullRequest.auto_merge) {
              core.info(`Auto-merge is already enabled for PR #${pullRequest.number}.`);
              return;
            }

            try {
              await github.graphql(
                `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(
                      input: {
                        pullRequestId: $pullRequestId
                        mergeMethod: SQUASH
                      }
                    ) {
                      pullRequest {
                        number
                      }
                    }
                  }
                `,
                {
                  pullRequestId: pullRequest.node_id,
                }
              );

              core.info(`Enabled auto-merge for PR #${pullRequest.number}.`);
            } catch (error) {
              core.warning(`Auto-merge could not be enabled automatically: ${error.message}`);
            }
