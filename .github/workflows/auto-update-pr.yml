name: Auto-update PR branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pr-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update open PR branches with latest main
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
            });

            for (const pr of prs) {
              // Only update same-repo branches (not forks)
              if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
                core.info(`Skipping fork PR #${pr.number}`);
                continue;
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                core.info(`Updated branch for PR #${pr.number} (${pr.head.ref})`);
              } catch (e) {
                core.warning(`Could not auto-update PR #${pr.number} (${pr.head.ref}): ${e.message}`);
              }
            }
