name: Auto open PR

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    if: startsWith(github.ref, 'refs/heads/') && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if needed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';

            const { data: existingPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base,
              head: `${owner}:${head}`,
              per_page: 1,
            });

            if (existingPulls.length > 0) {
              core.info(`Open PR #${existingPulls[0].number} already exists for ${head} -> ${base}.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: `Auto PR: ${head} → ${base}`,
              body: [
                '## Summary',
                '',
                `Automatically opened after a push to \`${head}\`.`,
                '',
                '## Validation',
                '',
                '- GitHub Actions PR validation workflow',
                '- Vercel preview deployment checks',
                '- Optional Copilot review comments',
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.info(`Created PR #${pull.number} for ${head} -> ${base}.`);
